name: Check delete branch on merge

# GitHub has no organization-wide default for "Automatically delete head branches", and a new repository starts
# with it off. This workflow checks every non-archived repository of the organization once a day (and on demand) and:
#   - opens an issue in each repository where the setting is off, saying how to turn it on (once: it doesn't open
#     another one when an issue with that title exists, open or closed, so a dismissed issue stays dismissed);
#   - closes that issue again once the setting is on.
# It only reads settings and files issues; it never changes a repository setting.
#
# Needs the secret REPO_AUDIT_TOKEN (an organization secret that this repository can read): a fine-grained personal
# access token of an organization member, resource owner abra-nl, "All repositories", with
#   Repository permissions: Administration: Read-only (to read the setting), Issues: Read and write
#   (Metadata: Read-only is added automatically).
# It can't change or delete anything. Such tokens expire (at most after a year): the run then fails with an error.
# The built-in GITHUB_TOKEN can't read or file anything in other repositories.
#
# Run it by hand with "dry run" to list what it would open or close, without doing it.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: List the issues that would be opened or closed, without doing it
        type: boolean
        default: false

permissions: {}

concurrency:
  group: check-delete-branch-on-merge
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check delete_branch_on_merge
        env:
          GH_TOKEN: ${{ secrets.REPO_AUDIT_TOKEN }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run }}
          TITLE: Turn on "Automatically delete head branches"
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The secret REPO_AUDIT_TOKEN isn't set (or this repository can't read it). See the header of this workflow."
            exit 1
          fi
          export TITLE
          body="This repository doesn't delete the branch of a pull request after it is merged, so merged branches pile up.

          Turn it on: **Settings > General > Pull Requests > Automatically delete head branches**. The branch of a merged pull request is then deleted (and can be restored from the pull request).

          This issue was opened by the workflow \`Check delete branch on merge\` of the organization's \`.github\` repository, and is closed by it once the setting is on. Close it yourself if this repository shouldn't delete merged branches: it isn't opened again."

          repos=$(gh repo list "$ORG" --no-archived --limit 1000 --json name --jq '.[].name')
          total=0 compliant=0 opened=0 closed=0 pending=0 problems=0
          {
            echo "### Delete branch on merge"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          note() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }

          for repo in $repos; do
            total=$((total + 1))
            read -r setting has_issues < <(gh api "repos/$ORG/$repo" --jq '"\(.delete_branch_on_merge) \(.has_issues)"')
            if [[ "$setting" != "true" && "$setting" != "false" ]]; then
              echo "::error::Can't read the setting of $repo (does the token have Administration: Read-only on it?)"
              note "**can't read** \`$repo\`"
              problems=$((problems + 1))
              continue
            fi

            # An issue with our title in this repository: "<number> <state>", the newest first (none when issues are off)
            existing=""
            if [[ "$has_issues" == "true" ]]; then
              existing=$(gh issue list --repo "$ORG/$repo" --state all --limit 200 --json number,state,title \
                --jq '[.[] | select(.title == env.TITLE)] | sort_by(.number) | reverse | .[] | "\(.number) \(.state)"' || true)
            fi
            open_issue=$(grep -m1 ' OPEN$' <<<"$existing" | cut -d' ' -f1 || true)

            if [[ "$setting" == "true" ]]; then
              compliant=$((compliant + 1))
              [[ -z "$open_issue" ]] && continue
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "Would close issue #$open_issue in $repo"
                note "would close \`$repo#$open_issue\`"
              elif gh issue close "$open_issue" --repo "$ORG/$repo" --comment "Automatically delete head branches is on now." >/dev/null; then
                echo "Closed issue #$open_issue in $repo"
                note "closed \`$repo#$open_issue\`"
              else
                echo "::error::Could not close issue #$open_issue in $repo"
                problems=$((problems + 1))
                continue
              fi
              closed=$((closed + 1))
              continue
            fi

            # The setting is off
            if [[ "$has_issues" != "true" ]]; then
              echo "::warning::$repo has the setting off and issues disabled, so no issue was opened"
              note "off, issues disabled: \`$repo\`"
              pending=$((pending + 1))
            elif [[ -n "$existing" ]]; then
              note "off, issue already raised: \`$repo#$(head -1 <<<"$existing" | cut -d' ' -f1)\`"
              pending=$((pending + 1))
            elif [[ "$DRY_RUN" == "true" ]]; then
              echo "Would open an issue in $repo"
              note "would open an issue in \`$repo\`"
              opened=$((opened + 1))
            elif url=$(gh issue create --repo "$ORG/$repo" --title "$TITLE" --body "$body"); then
              echo "Opened $url"
              note "opened $url"
              opened=$((opened + 1))
            else
              echo "::error::Could not open an issue in $repo (does the token have Issues: Read and write on it?)"
              problems=$((problems + 1))
            fi
          done

          summary="Checked $total repositories: $compliant on, $opened issue(s) opened, $closed closed, $pending off with an issue already raised or issues disabled, $problems problem(s)."
          [[ "$DRY_RUN" == "true" ]] && summary="$summary (Dry run: nothing was opened or closed.)"
          echo "$summary"
          { echo; echo "$summary"; } >> "$GITHUB_STEP_SUMMARY"
          [[ $problems -eq 0 ]]
