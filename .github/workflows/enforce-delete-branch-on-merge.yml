name: Enforce delete branch on merge

# GitHub has no organization-wide default for "Automatically delete head branches", and a new repository starts
# with it off. This workflow turns it on (`delete_branch_on_merge`) for every repository of the organization that
# doesn't have it yet, every day and on demand. Archived repositories are read-only and skipped.
#
# Needs the secret REPO_ADMIN_TOKEN (an organization secret that this repository can read): a token of an
# organization admin or a GitHub App that may change repository settings on all repositories:
#   - fine-grained personal access token: resource owner abra-nl, "All repositories", permission
#     Repository permissions > Administration: Read and write (Metadata: Read-only is added automatically).
#     These tokens expire (at most after a year): the run fails with an error when it does.
# The built-in GITHUB_TOKEN can't change the settings of other repositories.
#
# Run it by hand with "dry run" to see which repositories would change, without changing them.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: List the repositories that would change, without changing them
        type: boolean
        default: false

permissions: {}

concurrency:
  group: enforce-delete-branch-on-merge
  cancel-in-progress: false

jobs:
  delete-branch-on-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Turn on delete_branch_on_merge
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The secret REPO_ADMIN_TOKEN isn't set (or this repository can't read it). See the header of this workflow."
            exit 1
          fi

          # The repository list doesn't say whether the setting is on, so read each repository.
          repos=$(gh repo list "$ORG" --no-archived --limit 1000 --json name --jq '.[].name')
          total=0 changed=0 failed=0
          {
            echo "### Delete branch on merge"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for repo in $repos; do
            total=$((total + 1))
            current=$(gh api "repos/$ORG/$repo" --jq '.delete_branch_on_merge')
            [[ "$current" == "true" ]] && continue
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Would turn on delete_branch_on_merge for $repo"
              echo "- would change \`$repo\`" >> "$GITHUB_STEP_SUMMARY"
              changed=$((changed + 1))
            elif gh api -X PATCH "repos/$ORG/$repo" -F delete_branch_on_merge=true --silent; then
              echo "Turned on delete_branch_on_merge for $repo"
              echo "- changed \`$repo\`" >> "$GITHUB_STEP_SUMMARY"
              changed=$((changed + 1))
            else
              echo "::error::Could not change $repo (does the token have Administration: write on it?)"
              echo "- **failed** \`$repo\`" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
          done

          echo "Checked $total repositories: $changed changed$([[ "$DRY_RUN" == "true" ]] && echo ' (dry run)'), $failed failed."
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Checked $total repositories: $changed changed, $failed failed." >> "$GITHUB_STEP_SUMMARY"
          [[ $failed -eq 0 ]]
