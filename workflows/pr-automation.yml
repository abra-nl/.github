name: PR Automation

on:
  pull_request:
    types: [opened]

jobs:
  automate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign creator and reviewers
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const pr = context.payload.pull_request;
            const creator = pr.user.login;

            // 1. Assign creator as assignee
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [creator]
            });

            // 2. Auto assign reviewers (excluding creator)
            const reviewerPool = ['mikeslinkman', 'JJdeGroot'];
            const eligibleReviewers = reviewerPool.filter(r => r !== creator);

            // Randomly select reviewer from eligble reviewers pool
            const selectedReviewer = eligibleReviewers[Math.floor(Math.random() * eligibleReviewers.length)];

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers: [selectedReviewer]
            });

            // 3. Link Jira ticket based on branch name
            const branchName = pr.head.ref;
            const jiraMatch = branchName.match(/ABRA-(\d+)/);

            if (jiraMatch) {
              const jiraTicket = jiraMatch[0];
              const jiraUrl = `https://abra-nl.atlassian.net/browse/${jiraTicket}`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🔗 Linked Jira ticket: [${jiraTicket}](${jiraUrl})`
              });
            }
